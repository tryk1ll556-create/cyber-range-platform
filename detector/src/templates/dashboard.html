<!DOCTYPE html>
<html>

<head>

<title>Cyber Range SOC Dashboard</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    padding:30px;
}

h1{
    color:#38bdf8;
    margin-bottom:25px;
}

.container{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.5);
}

.feed-item{
    border-bottom:1px solid #334155;
    padding:10px 0;
}

.low{color:#22c55e}
.medium{color:#facc15}
.high{color:#f97316}
.critical{color:#ef4444}

.score{
    font-size:40px;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>🛡 Cyber Range SOC Dashboard</h1>

<div class="container">

<div class="card">
<h2>📊 System Statistics</h2>
<div id="stats"></div>
</div>

<div class="card">
<h2>🎯 Threat Score</h2>
<div id="score" class="score">0</div>
</div>

<div class="card">
<h2>👾 Top Attackers</h2>
<div id="attackers"></div>
</div>

<div class="card">
<h2>🔴 Live Attack Feed</h2>
<div id="feed"></div>
</div>

</div>

<script>

function calculateThreatScore(events){

    let score = 0

    events.forEach(e => {

        let risk = e.risk || "LOW"
        
        if(risk === "LOW") score += 1
        if(risk === "MEDIUM") score += 3
        if(risk === "HIGH") score += 6
        if(risk === "CRITICAL") score += 10

    })

    return score
}

function attackEmoji(detections){
    let types = detections.join(",")
    
    if(types.includes("SQL")) return "💉"
    if(types.includes("XSS")) return "⚡"
    if(types.includes("PATH")) return "📂"
    if(types.includes("POISON_NULL_BYTE")) return "💀"

    return "⚠️"
}

function formatTimestamp(timestamp){
    if(!timestamp) return "Unknown"
    let date = new Date(timestamp)
    return date.toLocaleTimeString()
}

async function loadStats(){

    try {
        let res = await fetch("/stats")
        let data = await res.json()

        document.getElementById("stats").innerHTML = `
        📥 Total Requests: ${data.total_requests || 0}<br>
        🚨 Detected Attacks: ${data.detected_attacks || 0}<br>
        💉 SQL Injection: ${data.sql_injections || 0}<br>
        ⚡ XSS: ${data.xss_attacks || 0}<br>
        📂 Path Traversal: ${data.path_traversals || 0}<br>
        💀 Poison Null Byte: ${data.null_byte_attacks || 0}
        `
    } catch(e) {
        document.getElementById("stats").innerHTML = "Ошибка загрузки статистики"
    }
}

async function loadTimeline(){

    try {
        let res = await fetch("/timeline")
        let events = await res.json()

        let feed = document.getElementById("feed")
        let attackers = {}

        feed.innerHTML = ""

        if(!events || events.length === 0) {
            feed.innerHTML = '<div class="feed-item">Атак пока нет</div>'
        }

        events.forEach(e => {

            let risk = e.risk || "LOW"
            let riskClass = risk.toLowerCase()
            let attackerName = e.attacker_id || e.ip_address || "unknown"
            let detections = e.detections || []
            let detectionText = detections.join(", ")

            let emoji = attackEmoji(detections)

            feed.innerHTML += `
            <div class="feed-item">
            ${emoji} [${formatTimestamp(e.timestamp)}]
            <b>${attackerName}</b>
            (${e.ip_address || "unknown"})
            <br>
            <span class="${riskClass}">${risk}</span>
            (${detectionText})
            </div>
            `

            if(!attackers[attackerName]){
                attackers[attackerName] = 0
            }

            attackers[attackerName]++

        })

        let attackersDiv = document.getElementById("attackers")

        attackersDiv.innerHTML = ""

        if(Object.keys(attackers).length === 0) {
            attackersDiv.innerHTML = "Нет атак"
        }

        Object.entries(attackers)
            .sort((a,b)=>b[1]-a[1])
            .slice(0,5)
            .forEach(a => {

            attackersDiv.innerHTML += `
            👤 ${a[0]} — ${a[1]} attacks<br>
            `
        })

        let score = calculateThreatScore(events)

        document.getElementById("score").innerText = score

    } catch(e) {
        console.error("Error loading timeline:", e)
        document.getElementById("feed").innerHTML = '<div class="feed-item">Ошибка загрузки</div>'
    }
}

async function update(){

    await loadStats()
    await loadTimeline()

}

update()

setInterval(update, 3000)

</script>

</body>

</html>
